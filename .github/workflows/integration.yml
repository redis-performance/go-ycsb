name: Integration

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  feature-store:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      # test/integration/feature_store.sh starts (and tears down) its own
      # disposable Redis/MongoDB containers, so this is the same command
      # a developer runs locally via `make test-integration-feature-store`.
      - name: Feature-store workload vs. dockerized Redis + MongoDB
        run: make test-integration-feature-store
        env:
          RECORDCOUNT: 100000

  cassandra-tls:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      # test/integration/cassandra_tls.sh starts (and tears down) its own
      # disposable, TLS-enabled ScyllaDB container plus a throwaway CA/cert
      # set, so this is the same command a developer runs locally via
      # `make test-integration-cassandra-tls`.
      - name: Cassandra TLS support vs. dockerized ScyllaDB
        run: make test-integration-cassandra-tls

  aerospike-tls:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      # test/integration/aerospike_tls.sh starts (and tears down) its own
      # disposable Aerospike Community Edition container plus a TLS-
      # terminating proxy and a throwaway CA/cert set, so this is the same
      # command a developer runs locally via `make test-integration-aerospike-tls`.
      - name: Aerospike TLS support vs. dockerized Aerospike
        run: make test-integration-aerospike-tls

  couchbase:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      # Network-free unit tests (TLS-scheme validation, subdocument-path
      # field-name safety, Update's branch-selection logic) - this repo
      # doesn't run `go test ./...` in CI (see CONTRIBUTING.md), so these
      # would otherwise never run automatically at all.
      - name: Couchbase adapter unit tests
        run: make test-couchbase

      # test/integration/couchbase.sh starts (and tears down, and initializes
      # via the management REST API) its own disposable Couchbase Community
      # Edition container, so this is the same command a developer runs
      # locally via `make test-integration-couchbase`.
      - name: Couchbase adapter vs. dockerized Couchbase Community Edition
        run: make test-integration-couchbase
        env:
          RECORDCOUNT: 20000

  cosmosdb:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      # Network-free unit tests (JSON Pointer field-name escaping,
      # Update's branch-selection logic, Cosmos DB system-property
      # stripping, consistency-level parsing) - see the Couchbase job's
      # comment above for why this repo runs these explicitly in CI.
      - name: Cosmos DB adapter unit tests
        run: make test-cosmosdb

      # test/integration/cosmosdb.sh starts (and tears down) its own
      # disposable Azure Cosmos DB (vNext) Linux emulator container, so this
      # is the same command a developer runs locally via
      # `make test-integration-cosmosdb`.
      - name: Cosmos DB adapter vs. dockerized Cosmos DB emulator
        run: make test-integration-cosmosdb
