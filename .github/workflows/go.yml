name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Test measurement, client, and command
        run: go test -race ./pkg/measurement ./pkg/client ./cmd/go-ycsb

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        os: ["linux", "darwin"]
        arch: ["amd64", "arm64"]
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Build for ${{ matrix.os }}-${{ matrix.arch }}
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          make
          tar -C bin -zcf go-ycsb-$GOOS-$GOARCH.tar.gz go-ycsb

      - name: Release latest build
        uses: softprops/action-gh-release@v3
        if: github.event_name == 'push'
        with:
          name: Latest Build ${{ github.sha }}
          tag_name: latest-${{ github.sha }}
          files: |
            *.tar.gz
      # Older latest-<sha> tags and releases are kept: consumers pin a latest-<sha>
      # release URL for reproducible builds, and deleting it on the next master push
      # breaks every such pin.
