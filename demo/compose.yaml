name: go-ycsb-heatmap-demo

x-ycsb-image: &ycsb-image
  image: go-ycsb-heatmap-demo:local
  build:
    context: ..
    dockerfile: Dockerfile
    args:
      VERSION: ${YCSB_DEMO_VERSION:-local-demo}

services:
  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 20

  load:
    <<: *ycsb-image
    command:
      - load
      - redis
      - -P
      - /workloads/workloada
      - -p
      - redis.addr=redis:6379
      - -p
      - recordcount=10000
      - -p
      - threadcount=8
    depends_on:
      redis:
        condition: service_healthy

  ycsb:
    <<: *ycsb-image
    command:
      - run
      - redis
      - -P
      - /workloads/workloada
      - -p
      - redis.addr=redis:6379
      - -p
      - recordcount=10000
      - -p
      - operationcount=1800000
      - -p
      - threadcount=8
      - -p
      - target=1000
      - -p
      - measurement.interval=1s
      - -p
      - measurement.prometheus_listen=0.0.0.0:9464
      - -p
      - measurement.prometheus_hdr_windows=true
    ports:
      - "127.0.0.1:9464:9464"
    depends_on:
      load:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v3.3.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      ycsb:
        condition: service_started

  grafana:
    image: grafana/grafana:12.0.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: local-demo-only
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_started

volumes:
  prometheus-data:
